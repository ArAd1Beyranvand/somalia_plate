name: somaliland_plate
description: "Somaliland's licence plates for the plate_core library — five 2018 classes (private, government, NGO, UN, diplomatic) and the 2005 bilingual plate, one theme each, and an advisory validator."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
